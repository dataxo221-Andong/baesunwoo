<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Wafer Classification</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .upload-container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-top: 20px;
        }

        #drop-zone {
            border: 3px dashed #cbd5e1;
            border-radius: 12px;
            padding: 40px;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8fafc;
        }

        #drop-zone:hover,
        #drop-zone.dragover {
            border-color: #3b82f6;
            background: #eff6ff;
        }

        #result-area {
            display: none;
            margin-top: 30px;
            border-top: 1px solid #e2e8f0;
            padding-top: 30px;
        }

        .result-box {
            background: #1e293b;
            color: white;
            padding: 20px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 15px;
        }

        .preview-img {
            max-width: 300px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .btn-back {
            display: inline-block;
            margin-top: 20px;
            color: #94a3b8;
            text-decoration: none;
        }

        .btn-back:hover {
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Wafer Defect Classification</h1>
        <p class="subtitle">딥러닝 모델을 이용한 웨이퍼 불량 패턴 자동 분류</p>

        <div class="upload-container">
            <div id="drop-zone">
                <div style="font-size: 3rem; margin-bottom: 10px;">📤</div>
                <h3>웨이퍼 이미지를 드래그하거나 클릭하여 업로드</h3>
                <p style="color: #64748b; font-size: 0.9rem;">지원 형식: PNG, JPG, JPEG</p>
                <input type="file" id="file-input" style="display: none;" accept="image/*">
            </div>

            <div id="loading" style="display: none; margin-top: 20px;">
                <p>분석 중입니다... 🧠</p>
            </div>

            <div id="result-area">
                <img id="preview" class="preview-img" src="" alt="Wafer Preview">
                <div>
                    <span style="color: #64748b;">분석 결과:</span>
                    <div class="result-box">
                        <h2 id="prediction-text" style="color: #4ade80; margin: 0;">Running...</h2>
                    </div>
                </div>
            </div>
        </div>

        <a href="/main" class="btn-back">← 메인으로 돌아가기</a>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const resultArea = document.getElementById('result-area');
        const previewImg = document.getElementById('preview');
        const predictionText = document.getElementById('prediction-text');
        const loading = document.getElementById('loading');

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) handleUpload(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleUpload(file);
        });

        function handleUpload(file) {
            // UI 초기화
            resultArea.style.display = 'none';
            loading.style.display = 'block';

            const formData = new FormData();
            formData.append('wafer_image', file);

            fetch('wafer/classify', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    loading.style.display = 'none';
                    if (data.status === 'success') {
                        previewImg.src = data.image_url;
                        predictionText.textContent = data.prediction;
                        resultArea.style.display = 'block';
                    } else {
                        alert('오류 발생: ' + data.message);
                    }
                })
                .catch(error => {
                    loading.style.display = 'none';
                    alert('업로드 실패');
                    console.error(error);
                });
        }
    </script>
</body>

</html>
